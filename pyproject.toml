[project]
name = "data-generate"
version = "0.1.0"
description = "Collect MoE routing data with upstream vLLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    # vLLM selects compatible versions. Declare these to select the CUDA wheel index.
    "torch",
    "torchaudio",
    "torchcodec",
    "torchvision",
    "transformers",
    "vllm==0.32.0+cu129",
]

[project.scripts]
data-generate = "data_generate:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
vllm = { index = "vllm-cu129" }
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.32.0/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
